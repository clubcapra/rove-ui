<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>MAP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="leaflet.min.css"/>
  <script src="leaflet.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080808; font-family: 'Courier New', monospace; overflow: hidden; }

    #map {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 24px;
      background: #080808;
    }
    .leaflet-container { cursor: crosshair !important; }

    /* Status bar */
    #status-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 24px;
      background: #0f0f0f; border-top: 1px solid #2e2e2e;
      display: flex; align-items: center;
      font-size: 10px; color: #505050; z-index: 1000; pointer-events: none;
    }
    .sb { padding: 0 12px; border-right: 1px solid #222222; white-space: nowrap; }
    .sb:last-child { border-right: none; }
    #sb-coords { color: #d0d8e0; }
    .sb-spacer { flex: 1; }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: #161616; color: #d0d8e0;
      border: 1px solid #2e2e2e; border-radius: 0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.85), 0 0 0 1px rgba(0,212,255,0.06);
      font-family: 'Courier New', monospace; font-size: 11px;
    }
    .leaflet-popup-content { margin: 10px 14px; }
    .leaflet-popup-tip { background: #161616; }
    .leaflet-popup-close-button { color: #505050 !important; font-size: 18px !important; }
    .leaflet-popup-close-button:hover { color: #ffae00 !important; background: transparent !important; }

    /* Zoom controls */
    .leaflet-control-zoom a {
      background: #161616 !important; color: #d0d8e0 !important;
      border-color: #2e2e2e !important; border-radius: 0 !important;
      font-family: monospace;
    }
    .leaflet-control-zoom a:hover { background: #1e1e1e !important; color: #ffae00 !important; }
    .leaflet-bar { border: 1px solid #2e2e2e !important; box-shadow: none !important; }
    .leaflet-bar a { border-bottom-color: #2e2e2e !important; }
    .leaflet-control-attribution {
      background: rgba(6,10,15,0.8) !important; color: #1e3040 !important;
      font-family: monospace; font-size: 9px;
    }
    .leaflet-control-attribution a { color: #484848 !important; }

    /* POI popup content */
    .tac-popup { display: flex; flex-direction: column; gap: 4px; }
    .tac-label { color: #ffae00; font-weight: 700; letter-spacing: 1px; }
    .tac-coords { color: #505050; font-size: 10px; }
    .tac-popup img { max-width: 200px; max-height: 150px; margin-top: 6px; border: 1px solid #2e2e2e; }

    /* Click flash */
    @keyframes flash {
      0%   { opacity: 1; transform: scale(0.4); }
      60%  { opacity: 0.7; transform: scale(1.8); }
      100% { opacity: 0; transform: scale(2.4); }
    }
    .click-flash {
      position: absolute; width: 14px; height: 14px;
      border: 1px solid #ffae00;
      pointer-events: none;
      animation: flash 0.45s ease-out forwards;
      margin-left: -7px; margin-top: -7px; z-index: 2000;
    }

    /* Recenter button */
    #btn-recenter {
      position: absolute;
      top: 80px; left: 10px;
      z-index: 1000;
      width: 26px; height: 26px;
      background: #161616;
      border: 1px solid #2e2e2e;
      color: #505050;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    #btn-recenter:hover {
      background: #1e1e1e;
      border-color: #ffae00;
      color: #ffae00;
    }
    #btn-recenter:active { background: #080808; }

    /* ── Action wheel ───────────────────────────────────────────── */
    #action-wheel {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3000;
    }
    #aw-backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.30);
      cursor: default;
    }
    #aw-ring {
      position: absolute;
      width: 0; height: 0;
    }
    /* Coordinates label at center */
    #aw-coords-box {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #0a0a0a;
      border: 1px solid #2e2e2e;
      color: #484848;
      font-size: 9px;
      font-family: 'Courier New', monospace;
      padding: 4px 8px;
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
    /* Radial buttons */
    .aw-btn {
      position: absolute;
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #0f0f0f;
      border: 1.5px solid #2e2e2e;
      color: #d0d8e0;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      transform: translate(-50%, -50%);
      transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .aw-btn:hover, .aw-btn:active {
      background: #1a1a1a;
      border-color: #ffae00;
      color: #ffae00;
      box-shadow: 0 0 16px rgba(255,174,0,0.25);
    }
    .aw-btn.aw-goto:hover, .aw-btn.aw-goto:active {
      border-color: #00e676;
      color: #00e676;
      box-shadow: 0 0 16px rgba(0,230,118,0.2);
    }
    .aw-btn.aw-cancel:hover, .aw-btn.aw-cancel:active {
      border-color: #ff3d3d;
      color: #ff3d3d;
      box-shadow: 0 0 16px rgba(255,61,61,0.2);
    }
    .aw-icon { font-size: 20px; line-height: 1; }
    .aw-lbl  { font-size: 7px; letter-spacing: 1.5px; font-weight: 700; opacity: 0.85; }

    /* Connector lines from center */
    #aw-ring svg {
      position: absolute;
      overflow: visible;
      pointer-events: none;
      left: 0; top: 0;
    }

    @keyframes aw-pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      70%  { transform: translate(-50%, -50%) scale(1.08); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes aw-pop-coords {
      0%   { opacity: 0; }
      40%  { opacity: 0; }
      100% { opacity: 1; }
    }
    #aw-ring.aw-open .aw-btn {
      animation: aw-pop 0.22s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }
    #aw-ring.aw-open #aw-coords-box {
      animation: aw-pop-coords 0.3s ease forwards;
    }
    #aw-btn-poi   { animation-delay: 0ms !important; }
    #aw-btn-goto  { animation-delay: 30ms !important; }
    #aw-btn-cancel{ animation-delay: 60ms !important; }
  </style>
</head>
<body>
<div id="map"></div>
<button id="btn-recenter" title="Recentrer sur le robot">⊕</button>
<div id="status-bar">
  <span class="sb" id="sb-coords">-- / --</span>
  <span class="sb" id="sb-zoom">ZOOM --</span>
  <span class="sb" id="sb-pois">0 WAYPOINTS</span>
  <span class="sb-spacer"></span>
  <span class="sb" style="color:#222222;">&#9658; TAP TO PLACE ACTION</span>
</div>

<!-- Action wheel overlay -->
<div id="action-wheel">
  <div id="aw-backdrop"></div>
  <div id="aw-ring">
    <svg id="aw-lines" width="1" height="1"></svg>
    <div id="aw-coords-box">-- / --</div>
    <button class="aw-btn aw-poi"    id="aw-btn-poi">
      <span class="aw-icon">◆</span>
      <span class="aw-lbl">P.O.I.</span>
    </button>
    <button class="aw-btn aw-goto"   id="aw-btn-goto">
      <span class="aw-icon">⊕</span>
      <span class="aw-lbl">GOTO</span>
    </button>
    <button class="aw-btn aw-cancel" id="aw-btn-cancel">
      <span class="aw-icon">✕</span>
      <span class="aw-lbl">ANNULER</span>
    </button>
  </div>
</div>

<script>
  // ── Map ───────────────────────────────────────────────────────────────
  const map = L.map('map', { zoomControl: true }).setView([45.5048, -73.5773], 15);

  let currentTileLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '&copy; Esri' }
  ).addTo(map);

  window.mapSetTileLayer = function(url, opts) {
    if (currentTileLayer) map.removeLayer(currentTileLayer);
    currentTileLayer = L.tileLayer(url, opts || { maxZoom: 19 }).addTo(map);
  };

  // ── Status bar ────────────────────────────────────────────────────────
  const sbCoords = document.getElementById('sb-coords');
  const sbZoom   = document.getElementById('sb-zoom');
  const sbPois   = document.getElementById('sb-pois');

  function updateZoom() { sbZoom.textContent = 'ZOOM ' + map.getZoom(); }
  updateZoom();
  map.on('zoomend', updateZoom);
  map.on('mousemove', function(e) {
    sbCoords.textContent = e.latlng.lat.toFixed(6) + ' / ' + e.latlng.lng.toFixed(6);
  });
  function updatePoiCount() {
    const n = Object.keys(pois).length;
    sbPois.textContent = n + ' WAYPOINT' + (n !== 1 ? 'S' : '');
  }

  // ── Icon config ───────────────────────────────────────────────────────
  let _robotIconUrl = null, _robotIconSize = [36, 36];
  let _poiIconUrl   = null, _poiIconSize   = [24, 32];
  let robotYaw = 0;

  function _robotIconHtml(yaw) {
    const [w, h] = _robotIconUrl ? _robotIconSize : [36, 36];
    const inner = _robotIconUrl
      ? '<img src="' + _robotIconUrl + '" style="width:' + w + 'px;height:' + h + 'px;display:block"/>'
      : '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="-18 -18 36 36">' +
        '<circle r="16" fill="rgba(0,0,0,0.55)" stroke="#ffae00" stroke-width="1.5"/>' +
        '<polygon points="0,-13 -7,7 7,7" fill="#ffae00" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>' +
        '<circle r="3" fill="#ffae00"/></svg>';
    return '<div class="robot-cursor-wrap" style="transform:rotate(' + yaw + 'deg);width:' + w + 'px;height:' + h + 'px">' + inner + '</div>';
  }

  let _lastRobotLat = null, _lastRobotLng = null;

  const robotMarker = L.marker([45.5048, -73.5773], {
    icon: L.divIcon({ html: _robotIconHtml(0), iconSize: [36,36], iconAnchor: [18,18], className: '' }),
    zIndexOffset: 1000
  });
  let robotVisible = false;

  const pois = {};
  let poiCounter = 0;

  // ── Navigation ────────────────────────────────────────────────────────
  const PAN_PX = 100;
  window.mapPanLeft  = () => map.panBy([-PAN_PX, 0]);
  window.mapPanRight = () => map.panBy([ PAN_PX, 0]);
  window.mapPanUp    = () => map.panBy([0, -PAN_PX]);
  window.mapPanDown  = () => map.panBy([0,  PAN_PX]);
  window.mapZoomIn   = () => map.zoomIn();
  window.mapZoomOut  = () => map.zoomOut();

  window.mapSetView = function(lat, lng, zoom) {
    map.setView([lat, lng], zoom !== undefined ? zoom : map.getZoom());
  };

  window.mapRecenter = function() {
    if (_lastRobotLat !== null && _lastRobotLng !== null) {
      map.setView([_lastRobotLat, _lastRobotLng], map.getZoom());
    }
  };

  document.getElementById('btn-recenter').addEventListener('click', function(e) {
    e.stopPropagation();
    window.mapRecenter();
  });

  // ── Robot ─────────────────────────────────────────────────────────────
  window.mapSetRobotPosition = function(lat, lng) {
    _lastRobotLat = lat;
    _lastRobotLng = lng;
    robotMarker.setLatLng([lat, lng]);
    if (!robotVisible) { robotMarker.addTo(map); robotVisible = true; }
  };
  window.mapSetRobotYaw = function(yaw_deg) {
    robotYaw = yaw_deg;
    const el = robotMarker.getElement();
    if (el) {
      const wrap = el.querySelector('.robot-cursor-wrap');
      if (wrap) wrap.style.transform = 'rotate(' + yaw_deg + 'deg)';
    }
  };
  window.mapSetRobotIcon = function(url, w, h) {
    _robotIconUrl = url;
    if (w && h) _robotIconSize = [w, h];
    const [iw, ih] = _robotIconSize;
    robotMarker.setIcon(L.divIcon({
      html: _robotIconHtml(robotYaw),
      iconSize: [iw, ih], iconAnchor: [iw/2, ih/2], className: ''
    }));
  };
  window.mapSetPOIIcon = function(url, w, h) {
    _poiIconUrl = url;
    if (w && h) _poiIconSize = [w, h];
  };

  // ── GOTO marker ───────────────────────────────────────────────────────
  let gotoMarker = null;
  function _gotoIconHtml() {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="-14 -14 28 28">' +
      '<circle r="12" fill="rgba(0,0,0,0.55)" stroke="#00e676" stroke-width="1" stroke-dasharray="3 2"/>' +
      '<polygon points="0,-8 -5,4 5,4" fill="#00e676" stroke="#080808" stroke-width="0.8"/>' +
      '<circle r="2" fill="#00e676"/>' +
      '</svg>';
  }

  function setGotoMarker(lat, lng) {
    if (gotoMarker) { map.removeLayer(gotoMarker); }
    gotoMarker = L.marker([lat, lng], {
      icon: L.divIcon({ html: _gotoIconHtml(), iconSize: [32,32], iconAnchor: [16,16], className: '' }),
      zIndexOffset: 900
    }).addTo(map);
    gotoMarker.bindPopup(
      '<div class="tac-popup">' +
      '<div class="tac-label" style="color:#00e676">⊕ GOTO TARGET</div>' +
      '<div class="tac-coords">' + lat.toFixed(6) + ' / ' + lng.toFixed(6) + '</div></div>'
    );
  }

  // ── POI ───────────────────────────────────────────────────────────────
  function _poiMarkerIcon() {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="-8 -8 16 16">' +
      '<polygon points="0,-7 7,0 0,7 -7,0" fill="#ffae00" stroke="#080808" stroke-width="1.2"/>' +
      '<circle r="2" fill="rgba(255,255,255,0.5)"/>' +
      '</svg>';
    return L.divIcon({ html: svg, iconSize: [16,16], iconAnchor: [8,8], className: '' });
  }

  window.mapAddPOI = function(lat, lng, label, poiId) {
    const id = (poiId && poiId !== '') ? poiId : ('poi_' + (++poiCounter));
    const safeLabel = label || id;
    const latStr = parseFloat(lat).toFixed(6);
    const lngStr = parseFloat(lng).toFixed(6);
    const marker = L.marker([lat, lng], { icon: _poiMarkerIcon(), zIndexOffset: 500 }).addTo(map);
    marker.bindPopup(
      '<div class="tac-popup">' +
      '<div class="tac-label">&#9670; ' + safeLabel + '</div>' +
      '<div class="tac-coords">' + latStr + ' / ' + lngStr + '</div>' +
      '<div id="photo_' + id + '"></div></div>'
    );
    pois[id] = { marker, label: safeLabel, photo: null };
    updatePoiCount();
    return id;
  };

  window.mapRemovePOI = function(id) {
    if (!pois[id]) return;
    map.removeLayer(pois[id].marker);
    delete pois[id];
    updatePoiCount();
  };

  window.mapAttachPhoto = function(id, dataUrl) {
    const poi = pois[id];
    if (!poi) return false;
    poi.photo = dataUrl;
    const ll = poi.marker.getLatLng();
    const img = dataUrl ? '<img src="' + dataUrl + '"/>' : '';
    poi.marker.setPopupContent(
      '<div class="tac-popup">' +
      '<div class="tac-label">&#9670; ' + poi.label + '</div>' +
      '<div class="tac-coords">' + ll.lat.toFixed(6) + ' / ' + ll.lng.toFixed(6) + '</div>' +
      img + '</div>'
    );
    return true;
  };

  window.mapGetPOIs = function() {
    return Object.keys(pois).map(function(id) {
      const ll = pois[id].marker.getLatLng();
      return { id, lat: ll.lat, lng: ll.lng, label: pois[id].label, hasPhoto: !!pois[id].photo };
    });
  };

  // ── Click flash helper ────────────────────────────────────────────────
  function showClickFlash(pt, color) {
    const flash = document.createElement('div');
    flash.className = 'click-flash';
    flash.style.left = pt.x + 'px';
    flash.style.top  = pt.y + 'px';
    if (color) flash.style.borderColor = color;
    document.getElementById('map').appendChild(flash);
    setTimeout(function() { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 500);
  }

  // ── Action wheel ──────────────────────────────────────────────────────
  let _awLat = null, _awLng = null;

  // Button positions: angle in degrees (0=right, -90=top)
  // POI: top (-90°), GOTO: bottom-right (30°), CANCEL: bottom-left (150°)
  const _AW_RADIUS = 88;
  const _AW_ANGLES = { 'aw-btn-poi': -90, 'aw-btn-goto': 30, 'aw-btn-cancel': 150 };

  function showActionWheel(lat, lng, containerPoint) {
    _awLat = lat;
    _awLng = lng;

    const mapEl = document.getElementById('map');
    const mw = mapEl.offsetWidth;
    const mh = mapEl.offsetHeight;

    // Clamp so buttons don't go off-screen
    const R = _AW_RADIUS + 32;
    const x = Math.max(R, Math.min(mw - R, containerPoint.x));
    const y = Math.max(R, Math.min(mh - R - 24, containerPoint.y));

    const ring = document.getElementById('aw-ring');
    ring.style.left = x + 'px';
    ring.style.top  = y + 'px';

    document.getElementById('aw-coords-box').textContent =
      lat.toFixed(6) + ' / ' + lng.toFixed(6);

    // Position each button radially
    for (const [id, deg] of Object.entries(_AW_ANGLES)) {
      const rad = deg * Math.PI / 180;
      const bx = Math.round(Math.cos(rad) * _AW_RADIUS);
      const by = Math.round(Math.sin(rad) * _AW_RADIUS);
      const btn = document.getElementById(id);
      btn.style.left = bx + 'px';
      btn.style.top  = by + 'px';
    }

    // Draw connector lines in SVG
    const svg = document.getElementById('aw-lines');
    let svgContent = '';
    for (const deg of Object.values(_AW_ANGLES)) {
      const rad = deg * Math.PI / 180;
      const x2 = Math.round(Math.cos(rad) * (_AW_RADIUS - 32));
      const y2 = Math.round(Math.sin(rad) * (_AW_RADIUS - 32));
      svgContent += '<line x1="0" y1="0" x2="' + x2 + '" y2="' + y2 +
        '" stroke="#2e2e2e" stroke-width="1" stroke-dasharray="3 3"/>';
    }
    svg.innerHTML = svgContent;

    const wheel = document.getElementById('action-wheel');
    wheel.style.display = 'block';
    ring.classList.remove('aw-open');
    requestAnimationFrame(function() { ring.classList.add('aw-open'); });
  }

  function hideActionWheel() {
    document.getElementById('action-wheel').style.display = 'none';
    document.getElementById('aw-ring').classList.remove('aw-open');
    _awLat = null;
    _awLng = null;
  }

  // Dismiss on backdrop or Escape
  document.getElementById('aw-backdrop').addEventListener('click', hideActionWheel);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideActionWheel();
  });

  // WAYPOINT action
  document.getElementById('aw-btn-poi').addEventListener('click', function(e) {
    e.stopPropagation();
    const lat = _awLat, lng = _awLng;
    hideActionWheel();
    showClickFlash(map.latLngToContainerPoint(L.latLng(lat, lng)), '#ffae00');
    console.log('__mapcb__:' + JSON.stringify({ action: 'poi', lat: lat, lng: lng }));
  });

  // GOTO action
  document.getElementById('aw-btn-goto').addEventListener('click', function(e) {
    e.stopPropagation();
    const lat = _awLat, lng = _awLng;
    hideActionWheel();
    setGotoMarker(lat, lng);
    showClickFlash(map.latLngToContainerPoint(L.latLng(lat, lng)), '#00e676');
    console.log('__mapcb__:' + JSON.stringify({ action: 'goto', lat: lat, lng: lng }));
  });

  // CANCEL
  document.getElementById('aw-btn-cancel').addEventListener('click', function(e) {
    e.stopPropagation();
    hideActionWheel();
  });

  // ── Map click → show wheel ────────────────────────────────────────────
  map.on('click', function(e) {
    // Don't open wheel if already open — dismiss instead
    if (document.getElementById('action-wheel').style.display === 'block') {
      hideActionWheel();
      return;
    }
    const pt = map.latLngToContainerPoint(e.latlng);
    showClickFlash(pt, '#484848');
    showActionWheel(e.latlng.lat, e.latlng.lng, pt);
  });
</script>
</body>
</html>
