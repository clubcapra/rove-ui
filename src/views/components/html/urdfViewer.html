<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>URDF Robot Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #f0f2f5;
    }
    #c { display: block; width: 100%; height: calc(100% - 28px); }

    /* ── thermal bar ────────────────────────────────────────────── */
    #thermal-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 28px;
      background: #f0f2f5;
      border-top: 1px solid #bfc5cf;
      display: flex; align-items: center;
      padding: 0 8px; gap: 6px;
      font-family: 'Courier New', monospace; font-size: 9px;
    }
    .tb-sep { color: #bfc5cf; flex-shrink: 0; }
    .tb-motor { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    .tb-lbl { color: #7a8591; width: 18px; flex-shrink: 0; font-weight: 700; }
    .tb-track {
      flex: 1; height: 3px; background: #d0d5de; overflow: hidden;
    }
    .tb-fill { height: 100%; width: 0%; background: #1a6fff; transition: width 0.35s ease, background-color 0.35s ease; }
    .tb-val { width: 30px; text-align: right; flex-shrink: 0; color: #7a8591; transition: color 0.35s; }

    /* ── overlay UI ─────────────────────────────────────────────── */
    #ui {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }

    /* loading bar */
    #loading {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: #bfc5cf;
    }
    #loading-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #c07800, #d4910a);
      transition: width 0.25s;
    }

    /* joint panel (bottom-left) */
    #joint-panel {
      position: absolute; bottom: 10px; left: 10px;
      max-width: 220px; max-height: 55vh;
      overflow-y: auto;
      background: rgba(240,242,245,0.94);
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 8px;
      padding: 8px 10px;
      font: 11px/1.5 "Segoe UI", monospace;
      color: #606870;
      pointer-events: auto;
    }
    #joint-panel::-webkit-scrollbar { width: 4px; }
    #joint-panel::-webkit-scrollbar-thumb { background: #a8b1bc; border-radius: 2px; }
    .jp-title { font-weight: 700; color: #1a1d22; margin-bottom: 6px; font-size: 12px; }
    .jp-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .jp-dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0; background: #bfc5cf;
      transition: background 0.2s;
    }
    .jp-dot.active { background: #c07800; }
    .jp-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jp-val { color: #b86000; font-family: monospace; min-width: 44px; text-align: right; }

    /* info top-right */
    #info {
      position: absolute; top: 10px; right: 10px;
      background: rgba(240,242,245,0.88);
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 6px; padding: 6px 10px;
      font: 11px "Segoe UI", sans-serif; color: #606870;
    }
    #info b { color: #1a1d22; }
  </style>

  <!-- URDF data injected by Python -->
  <script>/* URDF_DATA_PLACEHOLDER */</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="thermal-bar"></div>
<div id="ui">
  <div id="loading"><div id="loading-bar"></div></div>
  <div id="joint-panel">
    <div class="jp-title">Joints</div>
    <div id="joint-rows"></div>
  </div>
  <div id="info"><b>URDF</b> — orbit: drag · zoom: scroll · pan: right-drag</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';

// ── renderer ──────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f2f5);
scene.fog = new THREE.FogExp2(0xf0f2f5, 0.05);

// ── camera & controls ─────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
camera.position.set(1.5, 1.2, 2.0);
camera.lookAt(0, 0.3, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping  = true;
controls.dampingFactor  = 0.08;
controls.target.set(0, 0.3, 0);
controls.minDistance    = 0.3;
controls.maxDistance    = 12;

// ── lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far  = 30;
sun.shadow.camera.left   = -4;
sun.shadow.camera.right  =  4;
sun.shadow.camera.top    =  4;
sun.shadow.camera.bottom = -4;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x8ab4f8, 0.6).position.set(-3, 2, -3) && sun);

const fill = new THREE.DirectionalLight(0x8ab4f8, 0.5);
fill.position.set(-3, 2, -3);
scene.add(fill);

// ── ground ────────────────────────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(8, 32, 0x222222, 0x222222);
gridHelper.material.opacity = 0.45;
gridHelper.material.transparent = true;
scene.add(gridHelper);

const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.MeshStandardMaterial({ color: 0x0f0f0f, roughness: 0.95, transparent: true, opacity: 0.4 })
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// ── URDF kinematic tree ───────────────────────────────────────────────────────
const urdfData   = window.URDF_DATA || { root: null, links: {}, joints: [], link_colors: {} };
const linkGroups = {};   // link name → THREE.Group
const revolutes  = {};   // joint name → { group, axis Vector3, initialQ }
const jointAngles = {};  // joint name → current angle rad

// ── coordinate-system correction ──────────────────────────────────────────────
// URDF uses ROS convention: X-forward, Y-left, Z-up.
// GLBs exported from that toolchain keep Z-up geometry.
// Apply a -90° rotation around X to the root so Z-up → Y-up in Three.js.
const poseGroup = new THREE.Group();
const _off = urdfData.model_offset;
if (Array.isArray(_off) && _off.length >= 3) {
  poseGroup.position.set(_off[0], _off[1], _off[2]);
}
scene.add(poseGroup);

const D2R = Math.PI / 180;
const _rotCfg = urdfData.model_rotation;
const _baseRotX = -Math.PI / 2 + (Array.isArray(_rotCfg) && _rotCfg.length >= 1 ? _rotCfg[0] * D2R : 0);
const _baseRotY =                 (Array.isArray(_rotCfg) && _rotCfg.length >= 2 ? _rotCfg[1] * D2R : 0);
const _baseRotZ =                 (Array.isArray(_rotCfg) && _rotCfg.length >= 3 ? _rotCfg[2] * D2R : 0);
const _baseCorrection = new THREE.Quaternion().setFromEuler(new THREE.Euler(_baseRotX, _baseRotY, _baseRotZ));
poseGroup.quaternion.copy(_baseCorrection);

let _roll = 0, _pitch = 0, _yaw = 0;
function _updatePose() {
  const imu = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(-_roll, _yaw, _pitch, 'YZX')
  );
  poseGroup.quaternion.multiplyQuaternions(imu, _baseCorrection);
}

// ── build link groups ─────────────────────────────────────────────────────────
for (const name of Object.keys(urdfData.links)) {
  const g = new THREE.Group();
  g.name = name;
  linkGroups[name] = g;
}

// Wire joints
for (const joint of urdfData.joints) {
  const parentGroup = linkGroups[joint.parent];
  const childGroup  = linkGroups[joint.child];
  if (!parentGroup || !childGroup) continue;

  childGroup.position.set(...joint.xyz);

  if (joint.rpy && joint.rpy.some(v => Math.abs(v) > 1e-6)) {
    childGroup.rotation.set(joint.rpy[0], joint.rpy[1], joint.rpy[2], 'XYZ');
  }

  parentGroup.add(childGroup);

  if (joint.type === 'revolute' || joint.type === 'continuous') {
    revolutes[joint.name] = {
      group:    childGroup,
      axis:     new THREE.Vector3(...joint.axis),
      initialQ: childGroup.quaternion.clone(),
      limit:    joint.limit,
    };
    jointAngles[joint.name] = 0;
  }
}

// Mount root link
if (urdfData.root && linkGroups[urdfData.root]) {
  poseGroup.add(linkGroups[urdfData.root]);
} else {
  for (const g of Object.values(linkGroups)) {
    if (!g.parent) poseGroup.add(g);
  }
}

// ── color helper ──────────────────────────────────────────────────────────────
function applyLinkColor(gltfScene, hexColor) {
  const color = new THREE.Color(hexColor);
  gltfScene.traverse((child) => {
    if (!child.isMesh) return;
    const applyTo = (mat) => {
      const m = mat.clone();
      m.color = color;
      m.roughness  = Math.max(m.roughness  ?? 0.7, 0.35);
      m.metalness  = Math.min(m.metalness  ?? 0.1, 0.4);
      return m;
    };
    child.material = Array.isArray(child.material)
      ? child.material.map(applyTo)
      : applyTo(child.material);
    child.castShadow    = true;
    child.receiveShadow = true;
  });
}

function styleMesh(gltfScene) {
  gltfScene.traverse((child) => {
    if (!child.isMesh) return;
    child.castShadow    = true;
    child.receiveShadow = true;
    if (child.material) {
      const m = child.material;
      m.roughness = Math.max(m.roughness ?? 0.7, 0.35);
    }
  });
}

// ── GLB loading ───────────────────────────────────────────────────────────────
const meshLinks  = Object.entries(urdfData.links).filter(([, d]) => d.mesh_url);
const totalCount = meshLinks.length;
let   loadedCount = 0;
const loadingBar  = document.getElementById('loading-bar');

function onLoadProgress() {
  loadedCount++;
  const pct = totalCount > 0 ? (loadedCount / totalCount) * 100 : 100;
  loadingBar.style.width = pct + '%';
  if (loadedCount >= totalCount) {
    setTimeout(() => { loadingBar.parentElement.style.display = 'none'; }, 500);
    _fitCamera();
  }
}

function _fitCamera() {
  const box = new THREE.Box3().setFromObject(poseGroup);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist   = maxDim * 1.7;
  camera.position.set(
    center.x + dist * 0.55,
    center.y + dist * 0.45,
    center.z + dist * 0.75
  );
  controls.target.copy(center);
  controls.update();
}

const loader = new GLTFLoader();

if (totalCount === 0) {
  onLoadProgress();
} else {
  for (const [name, data] of meshLinks) {
    loader.load(
      data.mesh_url,
      (gltf) => {
        const mesh = gltf.scene;
        const color = urdfData.link_colors?.[name];
        if (color) {
          applyLinkColor(mesh, color);
        } else {
          styleMesh(mesh);
        }
        if (linkGroups[name]) linkGroups[name].add(mesh);
        console.log(`[URDF] loaded: ${name}${color ? ' color=' + color : ''}`);
        onLoadProgress();
      },
      undefined,
      (err) => {
        console.warn(`[URDF] failed: ${name} — ${err}`);
        onLoadProgress();
      }
    );
  }
}

// ── joint panel UI ────────────────────────────────────────────────────────────
const jointRowsEl = document.getElementById('joint-rows');
const jointDots   = {};
const jointValEls = {};

for (const [name, j] of Object.entries(revolutes)) {
  const row = document.createElement('div');
  row.className = 'jp-row';

  const dot = document.createElement('div');
  dot.className = 'jp-dot';

  const label = document.createElement('span');
  label.className = 'jp-name';
  label.textContent = name.replace('joint_', '').replace(/_/g, ' ');
  label.title = name;

  const val = document.createElement('span');
  val.className = 'jp-val';
  val.textContent = '0.0°';

  row.appendChild(dot);
  row.appendChild(label);
  row.appendChild(val);
  jointRowsEl.appendChild(row);
  jointDots[name]   = dot;
  jointValEls[name] = val;
}

if (Object.keys(revolutes).length === 0) {
  jointRowsEl.textContent = 'No revolute joints';
}

function _updateJointUI(name, rad) {
  if (jointValEls[name])
    jointValEls[name].textContent = (rad * 180 / Math.PI).toFixed(1) + '°';
  if (jointDots[name])
    jointDots[name].classList.toggle('active', Math.abs(rad) > 0.01);
}

// ── public API ────────────────────────────────────────────────────────────────

window.setJointAngle = function (name, angle) {
  const j = revolutes[name];
  if (!j) return;
  const q = new THREE.Quaternion().setFromAxisAngle(j.axis, angle);
  j.group.quaternion.multiplyQuaternions(j.initialQ, q);
  jointAngles[name] = angle;
  _updateJointUI(name, angle);
};

window.setJointAngles = function (obj) {
  for (const [n, a] of Object.entries(obj)) window.setJointAngle(n, a);
};

window.resetJoints = function () {
  for (const n of Object.keys(revolutes)) window.setJointAngle(n, 0);
};

window.setRobotRoll  = (r) => { _roll  = r; _updatePose(); };
window.setRobotPitch = (p) => { _pitch = p; _updatePose(); };
window.setRobotYaw   = (y) => { _yaw   = y; _updatePose(); };

window.setLinkColor = function(name, hex) {
  const group = linkGroups[name];
  if (!group) return;
  const color = new THREE.Color(hex);
  group.traverse(function(child) {
    if (!child.isMesh) return;
    const recolor = function(mat) {
      const m = mat.clone();
      m.color.set(color);
      return m;
    };
    child.material = Array.isArray(child.material)
      ? child.material.map(recolor)
      : recolor(child.material);
  });
};

if (window.URDF_DATA && window.URDF_DATA.hide_joint_panel) {
  const panel = document.getElementById('joint-panel');
  if (panel) panel.style.display = 'none';
}

// ── thermal bar setup ────────────────────────────────────────────────────────
(function() {
  const thermalLinks = (window.URDF_DATA && window.URDF_DATA.thermal_links) || [];
  const bar = document.getElementById('thermal-bar');

  if (thermalLinks.length === 0) {
    bar.style.display = 'none';
    canvas.style.height = '100%';
    return;
  }

  function shortName(link) {
    return link.replace('Drum', '').replace('Flipper', '');
  }

  thermalLinks.forEach(function(tl, i) {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'tb-sep';
      sep.textContent = '|';
      bar.appendChild(sep);
    }
    const motor = document.createElement('div');
    motor.className = 'tb-motor';
    motor.innerHTML =
      '<span class="tb-lbl">' + shortName(tl.link) + '</span>' +
      '<div class="tb-track"><div class="tb-fill" id="tbf-' + tl.link + '"></div></div>' +
      '<span class="tb-val" id="tbv-' + tl.link + '">--°</span>';
    bar.appendChild(motor);
  });
})();

window.setThermalBar = function(link, temp, minTemp, maxTemp, hex) {
  const fill = document.getElementById('tbf-' + link);
  const val  = document.getElementById('tbv-' + link);
  if (!fill || !val) return;
  const ratio = Math.max(0, Math.min(1, (temp - minTemp) / Math.max(maxTemp - minTemp, 1)));
  fill.style.width = (ratio * 100) + '%';
  fill.style.backgroundColor = hex;
  val.textContent = temp.toFixed(1) + '°';
  val.style.color = hex;
};

// ── resize & render ───────────────────────────────────────────────────────────
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

(function animate() {
  requestAnimationFrame(animate);
  resize();
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
